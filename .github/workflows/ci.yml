name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend
        run: dotnet restore ./ai-finance-tracker.csproj

      - name: Build backend
        run: dotnet build ./ai-finance-tracker.csproj --no-restore -p:UseAppHost=false

      - name: Test backend
        run: dotnet test ./tests/AiFinanceTracker.Tests/AiFinanceTracker.Tests.csproj -p:UseAppHost=false

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
